<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJ Kelly Kay Control Centre</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#131110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KK Centre">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script>try { var t = localStorage.getItem('kk_cc_theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
/* DJ Kelly Kay Control Centre: DJ Kelly Kay's back office. Same layout as the A.R.T control centre
   (dark menu down the left, top bar with search, cards and tables), in DJ Kelly Kay's orange. */
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1a1613; --ink2:#665d52;
  --gold:#FF5A1E; --gold-ink:#16130F; --gold-text:#b23c0d;
  --ok:#14703c; --warn:#8f5400; --bad:#c22a3f;
  --line:rgba(26,22,19,.12); --line2:rgba(26,22,19,.22);
  --field:#fff; --field-off:#f1eee8; --hover:#faf8f3; --pop:#fff;
  --tint:rgba(26,22,19,.06); --tint2:rgba(26,22,19,.11);
  --bar:rgba(246,244,239,.92); --side:#131110; --tip:#1a1613;
  --grid:#e6e1d7; --axis:#c8c0b4;
  --ok-bg:rgba(20,112,60,.11); --warn-bg:rgba(143,84,0,.12); --bad-bg:rgba(194,42,63,.1); --gold-bg:rgba(255,90,30,.24);
  --listen:#7b4ad1; --listen-bg:rgba(123,74,209,.12);
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --brand:'Unbounded','Arial Black',Impact,sans-serif;
  color-scheme:light;
}
/* Dark mode follows the device unless Light or Dark is picked in the account menu. Keep both blocks the same. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131110; --card:#1e1b18; --ink:#F2ECE2; --ink2:#b3aa9b; --gold-text:#FF7A45;
    --ok:#5bd394; --warn:#f2b866; --bad:#ff7d90;
    --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.24);
    --field:#26221e; --field-off:#191613; --hover:#24201c; --pop:#2a2622;
    --tint:rgba(255,255,255,.08); --tint2:rgba(255,255,255,.15);
    --bar:rgba(19,17,16,.9); --side:#0d0b0a; --tip:#3d362f;
    --grid:#2e2924; --axis:#5a5148;
    --ok-bg:rgba(91,211,148,.14); --warn-bg:rgba(242,184,102,.14); --bad-bg:rgba(255,125,144,.13); --gold-bg:rgba(255,90,30,.16);
    --listen:#b493f5; --listen-bg:rgba(180,147,245,.15);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#131110; --card:#1e1b18; --ink:#F2ECE2; --ink2:#b3aa9b; --gold-text:#FF7A45;
    --ok:#5bd394; --warn:#f2b866; --bad:#ff7d90;
    --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.24);
    --field:#26221e; --field-off:#191613; --hover:#24201c; --pop:#2a2622;
    --tint:rgba(255,255,255,.08); --tint2:rgba(255,255,255,.15);
    --bar:rgba(19,17,16,.9); --side:#0d0b0a; --tip:#3d362f;
    --grid:#2e2924; --axis:#5a5148;
    --ok-bg:rgba(91,211,148,.14); --warn-bg:rgba(242,184,102,.14); --bad-bg:rgba(255,125,144,.13); --gold-bg:rgba(255,90,30,.16);
    --listen:#b493f5; --listen-bg:rgba(180,147,245,.15);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
a{color:var(--gold-text);font-weight:600}
button,input,select,textarea{font-family:var(--sans)}
button{cursor:pointer;color:inherit}
input,select,textarea{font-size:15px;width:100%;min-height:42px;padding:9px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--field);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;padding:0;accent-color:#c99a10;flex:none;margin:0}
textarea{resize:vertical;min-height:96px;line-height:1.45}
input:disabled,select:disabled,textarea:disabled{background:var(--field-off);color:var(--ink2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.hint{font-size:13px;color:var(--ink2);margin-top:6px}
.muted{color:var(--ink2);font-size:14px}
.hide{display:none!important}
.tab{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:100px;font-weight:700;font-size:14.5px;border:0;text-decoration:none;white-space:nowrap}
.btn--gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 10px 24px -12px rgba(201,154,16,.7)}
.btn--ink{background:var(--ink);color:var(--bg)}
.btn--soft{background:var(--field);color:var(--ink);border:1px solid var(--line2)}
.btn--danger{background:var(--field);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.btn--sm{min-height:34px;padding:0 13px;font-size:13.5px}
.btn--xs{min-height:28px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--field);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn[disabled]{opacity:.35;cursor:default}

/* demo strip */
.demobar{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 14px;background:#0d0b0a;color:#fff;font-size:13px;line-height:1.35;text-align:center}
.demobar b{background:var(--gold);color:var(--gold-ink);border-radius:100px;padding:2px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.demobar span{opacity:.85}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{position:sticky;top:34px;height:calc(100vh - 34px);height:calc(100dvh - 34px);display:flex;flex-direction:column;background:var(--side);color:#fff;padding:20px 14px 16px;overflow-y:auto;z-index:30;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;text-decoration:none;color:#fff}
.brand__mark{width:38px;height:38px;border-radius:10px;background:#1d1824;border:1px solid rgba(255,90,30,.35);display:grid;place-items:center;font-family:var(--brand);color:var(--gold);font-size:13px;flex:none}
.brand__txt b{display:block;font-family:var(--brand);font-size:15px;font-weight:400;letter-spacing:.04em;line-height:1.1}
.brand__txt b i{font-style:normal;color:var(--gold)}
.brand__txt span{display:block;font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
.side__nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side__group{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:16px 12px 6px}
.nav__item{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 12px;border-radius:100px;color:rgba(255,255,255,.8);font-size:14.5px;font-weight:600;text-decoration:none}
.nav__item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav__item[aria-current=page]{background:var(--gold);color:var(--gold-ink);box-shadow:0 10px 24px -14px rgba(255,90,30,.9)}
.nav__label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav__badge{flex:none;min-width:22px;height:22px;padding:0 7px;border-radius:100px;background:#c22a3f;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.nav__item[aria-current=page] .nav__badge{background:var(--gold-ink);color:var(--gold)}
.side__foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.14)}
.side__foot a{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.75);font-size:13.5px;font-weight:600;text-decoration:none}
.side__foot a:hover{color:#fff}
.scrim{position:fixed;inset:0;background:rgba(10,9,12,.55);z-index:25}
.main{min-width:0}

/* top bar */
.topbar{position:sticky;top:34px;z-index:20;display:flex;align-items:center;gap:14px;height:62px;padding:0 32px;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar__menu{display:none;width:42px;height:42px;border:0;background:transparent;border-radius:12px;place-items:center;flex:none}
.topbar__title{font-weight:700;font-size:15px;color:var(--ink2);white-space:nowrap;flex:none;min-width:90px}
.search{position:relative;flex:1;max-width:460px}
.search input{height:40px;min-height:40px;border-radius:100px;padding:0 40px 0 40px;font-size:14.5px}
.search input::-webkit-search-cancel-button{display:none}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink2);pointer-events:none}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 12px var(--sans);color:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;pointer-events:none}
.search input:focus ~ kbd{display:none}
.topbar__actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.tb-icon{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--field);display:grid;place-items:center}
.tb-icon:hover,.avatar:hover{border-color:var(--ink)}
.tb-dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:#c22a3f;border:2px solid var(--field)}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid transparent;background:var(--gold);color:var(--gold-ink);font-family:var(--brand);font-size:12px;display:grid;place-items:center}
.menu{position:relative}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:40;min-width:230px;background:var(--pop);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 24px 60px -20px rgba(10,9,12,.4)}
.pop--right{left:auto;right:0}
.pop--wide{width:min(360px,calc(100vw - 24px))}
.pop__item{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border:0;background:transparent;border-radius:10px;font:600 14px var(--sans);color:var(--ink);text-decoration:none;text-align:left}
.pop__item:hover,.pop__item.on{background:var(--tint)}
.pop__item small{display:block;font-weight:400;font-size:12.5px;color:var(--ink2)}
.pop__head{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);padding:8px 12px 4px}
.pop__who{display:flex;flex-direction:column;padding:10px 12px 12px;margin-bottom:6px;border-bottom:1px solid var(--line);line-height:1.35}
.pop__who span{font-size:13px;color:var(--ink2)}
.pop img{width:34px;height:34px;border-radius:6px;object-fit:cover;flex:none}
.segs{display:flex;gap:4px;padding:4px 8px 8px}
.seg{flex:1;min-height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--field);font-size:13px;font-weight:600}
.seg[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search__results{left:0;right:0;max-height:min(70vh,480px);overflow-y:auto}
.wrap{max-width:1240px;margin:0 auto;padding:30px 32px 90px;outline:none}

/* page bits */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:clamp(25px,4vw,32px)}
.head p{color:var(--ink2);margin-top:4px}
.head__actions{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-bottom:10px;text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.tile__num{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile__cap{font-size:13.5px;color:var(--ink2);margin-top:2px}
.tile__split{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.tile__split b{color:var(--ink);font-weight:700}
.tile--warn{border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:linear-gradient(var(--bad-bg),var(--bad-bg)),var(--card)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.panel__h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel__h h2{font-size:18px}
.panel__h p{color:var(--ink2);font-size:13.5px;flex-basis:100%}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.cols--even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.row:first-of-type{border-top:0}
.row__main{min-width:0;display:flex;align-items:center;gap:12px}
.row__main > div{min-width:0}
.row__main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__main span{display:block;font-size:13px;color:var(--ink2)}
.row__side{display:flex;gap:8px;align-items:center;flex:none;font-variant-numeric:tabular-nums}
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:var(--tint)}
.thumb--sm{width:32px;height:32px;border-radius:5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink2)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);background:var(--tint);border-radius:100px;padding:3px 9px;white-space:nowrap}
.tag--live,.tag--paid,.tag--cleared,.tag--yes{color:var(--ok);background:var(--ok-bg)}
.tag--scheduled,.tag--pending,.tag--gold{color:var(--gold-text);background:var(--gold-bg)}
.tag--hidden,.tag--cancelled,.tag--refunded,.tag--unchecked{color:var(--warn);background:var(--warn-bg)}
.tag--grace,.tag--failed{color:var(--bad);background:var(--bad-bg)}
.tag--listen{color:var(--listen);background:var(--listen-bg)}

.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px}
.toolbar select{width:auto;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:100px;border:1px solid var(--line2);background:var(--field);font-size:13.5px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:12px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
td .cell{display:flex;align-items:center;gap:12px;min-width:220px}
td .cell b{display:block;font-weight:600}
td .cell span{display:block;font-size:12.5px;color:var(--ink2)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px;color:var(--ink2)}
.empty{padding:30px 16px;text-align:center;color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;font-size:14.5px;font-weight:700;color:var(--ink2);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--gold)}

/* forms */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{margin-bottom:14px}
.form__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line2);border-radius:11px;background:var(--field);font-size:14px;font-weight:600;color:var(--ink);margin:0;cursor:pointer}
.check:has(input:checked){border-color:var(--gold);background:var(--gold-bg)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:none;margin:0}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:100px;background:var(--tint2);transition:background .15s}
.switch span::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked + span{background:#2f9e5b}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.note{border-radius:12px;padding:11px 14px;font-size:13.5px;background:var(--tint);color:var(--ink2)}
.note b{color:var(--ink)}
.note--gold{background:var(--gold-bg);color:var(--ink)}

/* mix editor */
.ed{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.ed__side{position:sticky;top:112px}
.coverbig{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;display:block;background:var(--tint);box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.crops{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:14px}
.crop-tile{width:84px}
.crop-tile img{width:84px;height:84px;border-radius:6px;object-fit:cover;display:block}
.crop-tile b{display:block;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crop-lock{display:flex;align-items:center;gap:10px;background:rgba(240,238,236,.92);color:#16131a;border-radius:14px;padding:9px 10px}
.crop-lock img{width:44px;height:44px;border-radius:7px;object-fit:cover}
.crop-lock b{display:block;font-size:13px;line-height:1.2}
.crop-lock span{display:block;font-size:12px;color:#6a6470}
.crop-cap{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:12px}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;background:var(--field);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-bg)}
.drop b{display:block;font-size:15px}
.drop span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.filerow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--field)}
.filerow .fi{width:42px;height:42px;border-radius:10px;background:var(--gold-bg);color:var(--gold-text);display:grid;place-items:center;flex:none}
.filerow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filerow span{display:block;font-size:12.5px;color:var(--ink2)}
.bar{height:6px;border-radius:6px;background:var(--tint2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .15s}
.trk{width:100%;border-collapse:collapse;font-size:14px}
.trk th{padding:6px 6px;font-size:11px}
.trk td{padding:5px 6px;border-top:1px solid var(--line)}
.trk input{min-height:34px;padding:5px 9px;font-size:14px;border-radius:8px}
.trk .t-time{width:84px}
.trk .t-num{width:30px;color:var(--ink2);font-size:13px;text-align:center}
.trk tr.sel td{background:var(--gold-bg)}
.trk .acts{white-space:nowrap;width:1%}
.trk .acts .iconbtn{width:30px;height:30px}
.est{font-size:10.5px;font-weight:700;color:var(--gold-text);letter-spacing:.04em;text-transform:uppercase}
.fakeplayer{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#1a1613;color:#fff;margin-bottom:12px;flex-wrap:wrap}
.fakeplayer .pp{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--gold-ink);border:0;display:grid;place-items:center;flex:none}
.fakeplayer .tm{font-size:13px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.8);min-width:92px}
.fakeplayer input[type=range]{flex:1;min-width:120px;min-height:0;padding:0;border:0;background:transparent;accent-color:var(--gold)}
.fakeplayer .now{flex-basis:100%;font-size:12.5px;color:rgba(255,255,255,.7)}
.fakeplayer .now b{color:#fff}

/* waveform marker editor */
.wavebox{margin:0 0 12px}
.wavecv{display:block;width:100%;height:96px;border-radius:12px;background:#1a1613;touch-action:pan-y;cursor:pointer}
.wavebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.daw{position:fixed;inset:0;z-index:200;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:#0f0d0b;color:#F2ECE2;font-family:var(--sans)}
.daw__top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:#171411}
.daw__title{min-width:0;flex:1 1 220px}
.daw__title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daw__title span{display:block;font-size:12.5px;color:rgba(255,255,255,.6)}
.daw__ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daw .dbtn{min-height:34px;min-width:34px;padding:0 11px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:#23201c;color:#fff;font:600 13px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.daw .dbtn:hover{border-color:rgba(255,255,255,.45)}
.daw .dbtn[aria-pressed=true]{background:#FF5A1E;color:#16130F;border-color:#FF5A1E}
.daw .dbtn[disabled]{opacity:.35;cursor:default}
.daw .dbtn.gold{background:#FF5A1E;color:#16130F;border-color:#FF5A1E}
.daw .dplay{width:40px;height:40px;border-radius:50%;padding:0;background:#FF5A1E;color:#16130F;border:0}
.daw__time{font:700 15px var(--sans);font-variant-numeric:tabular-nums;min-width:118px;color:#fff}
.daw__time small{color:rgba(255,255,255,.55);font-weight:600}
.daw__grp{display:flex;gap:4px}
.daw__mini{display:block;width:100%;height:44px;background:#131110;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer;touch-action:none}
.daw__stage{position:relative;min-height:0}
.daw__stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.daw__foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid rgba(255,255,255,.1);background:#171411;font-size:13.5px}
.daw__song{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 260px}
.daw__song b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daw__song span{color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daw__num{flex:none;min-width:26px;height:26px;border-radius:50%;background:#FF5A1E;color:#16130F;font-weight:800;font-size:12.5px;display:grid;place-items:center;padding:0 6px}
.daw__foot input{width:96px;min-height:34px;padding:4px 10px;border-radius:8px;background:#23201c;border:1px solid rgba(255,255,255,.2);color:#fff;font-variant-numeric:tabular-nums}
.daw__keys{color:rgba(255,255,255,.55);font-size:12.5px}
.daw__keys kbd{font:600 11.5px var(--sans);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:0 5px;color:#fff;margin:0 2px}
.daw :focus-visible{outline:2px solid #FF5A1E;outline-offset:2px}
@media (max-width:700px){.daw__keys{display:none}.daw__top{padding:8px 10px}.daw__foot{padding:8px 10px}}

/* charts */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .tr{height:10px;border-radius:6px;background:var(--tint)}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:var(--gold)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}

/* phone preview for messages */
.phone{width:100%;max-width:300px;margin:0 auto;border-radius:30px;padding:14px;background:linear-gradient(160deg,#2a2433,#131110);box-shadow:0 20px 50px -25px rgba(0,0,0,.6)}
.phone__time{color:#fff;text-align:center;font-weight:700;font-size:40px;letter-spacing:-.02em;margin:8px 0 14px}
.notif{background:rgba(245,243,247,.95);color:#1a1420;border-radius:16px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.notif .from{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#6a5d75;margin-bottom:2px}
.notif b{display:block}
.notif--sms .from{color:#2f8f4e}

/* trigger cards */
.trigs{display:grid;gap:12px}
.trig{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.trig__h{display:flex;align-items:flex-start;gap:14px}
.trig__h > div{flex:1;min-width:0}
.trig__h h3{font-size:16px}
.trig__h p{font-size:13.5px;color:var(--ink2)}
.trig__stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:10px}
.trig__stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.trig details{margin-top:10px}
.trig summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--gold-text)}
.trig.off{opacity:.65}
.shelfrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--field);margin-bottom:6px}
.shelfrow b{flex:1;font-size:14.5px;font-weight:600}

/* dialog + toast */
dialog{border:0;padding:0;border-radius:20px;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(10,9,12,.55)}
.dlg{padding:22px}
.dlg h2{font-size:20px;margin-bottom:6px}
.dlg > p{color:var(--ink2);margin-bottom:14px}
.toast{position:fixed;left:calc(50% + 124px);bottom:22px;transform:translate(-50%,20px);background:var(--tip);color:#fff;font-size:14.5px;font-weight:600;padding:12px 20px;border-radius:100px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);z-index:80;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.cols--even{grid-template-columns:minmax(0,1fr)}
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed__side{position:static;display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
}
@media (max-width:900px){
  .shell{display:block}
  .scrim{z-index:65}
  .side{z-index:70;position:fixed;left:0;top:0;height:100vh;height:100dvh;width:min(280px,86vw);transform:translateX(-102%);transition:transform .2s ease;visibility:hidden}
  .shell.menu-open .side{transform:none;visibility:visible;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .topbar{padding:0 10px 0 4px;gap:8px;height:58px}
  .topbar__menu{display:grid}
  .topbar__title{display:none}
  .search{max-width:none}
  .search kbd{display:none}
  .search__results{position:fixed;left:8px;right:8px;top:100px}
  .wrap{padding:20px 14px 90px}
  .toast{left:50%}
  .topbar__new span{display:none}
  .topbar__new{padding:0 11px}
}
@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .tiles{gap:10px}
  .tile{padding:14px}
  .tile__num{font-size:23px}
  .ed__side{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:minmax(0,120px) minmax(0,1fr) 54px}
  .demobar span{font-size:12px}
  .panel{padding:16px}
  .trk .t-time{width:70px}
}
@media (prefers-reduced-motion:reduce){.side,.toast,.switch span,.switch span::after,.bar i{transition:none}}
</style>

</head>

            <div class="pop__who"><b>DJ Kelly Kay</b><span>Owner</span></div>

            <div class="segs" role="group" aria-label="Appearance">
              <button class="seg" type="button" data-theme-choice="auto">Auto</button>

            <a class="pop__item" href="#settings">Settings</a>
          </div>
        </div>
      </div>
    </header>
    <main class="wrap" id="view" tabindex="-1"></main>

let fanQ = '', fanPlan = 'all', fanSeg = 'all', fanPage = 0;
const SEGMENTS = [

function fanList(){
  const seg = SEGMENTS.find(s => s.id === fanSeg) || SEGMENTS[0];

    .sort((a, b) => a.last - b.last);
}

  return {rows, pager: `<span>${list.length} fans${list.length > per ? ` · page ${fanPage + 1} of ${pages}` : ''}</span><span style="display:flex;gap:6px"><button class="btn btn--soft btn--sm" data-act="fanPrev" ${fanPage ? '' : 'disabled'}>Previous</button><button class="btn btn--soft btn--sm" data-act="fanNext" ${fanPage < pages - 1 ? '' : 'disabled'}>Next</button></span>`};
}

/* ---------- stats ---------- */
let statMix = 'got-a-speaker-bro';
function dropOff(id){
  const m = mixBy(id), L = Math.round(toSecs(m.len) / 60), pts = [];
  for (let t = 0; t <= L; t++) { let v = 100 * Math.exp(-t / (L * 1.6)); if (t > SETTINGS.preview) v *= 0.62 + 0.1 * Math.cos(t / 9); pts.push(Math.max(4, v)); }
  const W = 720, H = 200, P = 36, x = t => P + t / L * (W - P - 10), y = v => H - 22 - v / 100 * (H - 36);
  let g = ''; for (let k = 0; k <= 4; k++) { const yy = y(k * 25); g += `<line x1="${P}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${P - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--ink2)">${k * 25}%</text>`; }
  const ticks = [0, Math.round(L / 4), Math.round(L / 2), Math.round(L * 3 / 4), L].map(t => `<text x="${x(t)}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--ink2)">${t} min</text>`).join('');
  const line = pts.map((v, t) => `${t ? 'L' : 'M'}${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of listeners still playing ${esc(m.t)} at each minute">${g}${ticks}
    <line x1="${x(SETTINGS.preview)}" x2="${x(SETTINGS.preview)}" y1="10" y2="${H - 22}" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="${x(SETTINGS.preview) + 6}" y="22" font-size="11" fill="var(--bad)">Preview ends</text>
    <path d="${line} L${x(L)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--gold-bg)"/><path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.5"/></svg>`;
}
function stats(){
  const byPlays = [...M].sort((a, b) => b.plays - a.plays).slice(0, 10);
  const conv = paid.filter(m => m.previews > 50).map(m => [m.t, Math.round(m.sales / m.previews * 1000) / 10]).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const skipped = ['forever-love','got-a-speaker-bro','y2klr'].flatMap(id => (TRACKS[id] || []).slice(1).map(x => { const [a, t] = x.split('|'); return {a, t, mix: mixBy(id).t}; })).filter((_, i) => i % 5 === 2).slice(0, 7).map((x, i) => ({...x, pct: 38 - i * 4}));
  const searched = [['Club Roma Vol 2',148],['Lauryn Hill',96],['Kolohe Kai',81],['Wedding songs',77],['Got A Speaker Bro Vol 2',63],['Christmas',55],['Gym mix',49],['Six60',41]];
  return `<div class="head"><div><h1>Stats</h1><p>What fans play, skip and look for. Use it to decide what to make next.</p></div></div>
  <div class="cols cols--even">
    <div class="panel"><div class="panel__h"><h2>Most played mixes</h2></div>${hbars(byPlays.map(m => [m.t, m.plays]))}</div>
    <div class="panel"><div class="panel__h"><h2>Previews that turn into sales</h2><p>Out of every 100 previews, how many people bought the mix.</p></div>${hbars(conv, v => v + '%')}</div>
  </div>
  <div class="panel"><div class="panel__h"><h2>Where people stop listening</h2><select id="statMix" style="width:auto;min-width:220px" aria-label="Mix">${M.filter(m => m.status === 'live').sort((a, b) => b.d.localeCompare(a.d)).map(m => `<option value="${m.id}" ${m.id === statMix ? 'selected' : ''}>${esc(m.t)}</option>`).join('')}</select>
    <p>The share of listeners still playing at each minute. The drop at the red line is people whose ${SETTINGS.preview}-minute preview ended.</p></div><div id="dropOff">${dropOff(statMix)}</div></div>
  <div class="cols cols--even">
    <div class="panel"><div class="panel__h"><h2>Most skipped songs</h2><p>Fans tapped to the next song within 30 seconds.</p></div>${skipped.map(s => `<div class="row"><div class="row__main"><div><b>${esc(s.t)}</b><span>${esc(s.a)} · in ${esc(s.mix)}</span></div></div><b class="tab">${s.pct}%</b></div>`).join('')}</div>
    <div class="panel"><div class="panel__h"><h2>Searched for, but no mix yet</h2><p>Ideas for the next mix.</p></div>${searched.map(([q, n]) => `<div class="row"><div class="row__main"><div><b>${esc(q)}</b><span>${n} searches in the last 30 days</span></div></div><a class="btn btn--soft btn--xs" href="#mixes/new">Make it</a></div>`).join('')}</div>
  </div>`;
}

/* ---------- router ---------- */
function route(){
  const [r = 'dashboard', a, b] = (location.hash.slice(1) || 'dashboard').split('/');
  return {r: TITLES[r] ? r : 'dashboard', a, b};
}
function render(keepScroll){
  const {r, a} = route();
  if (!(r === 'mixes' && a)) { stopFake(); if (ED && !(r === 'mixes' && a)) ED = null; }
  let html;
  if (r === 'dashboard') html = dashboard();
  else if (r === 'mixes') html = a ? mixEditor(a) : mixes();
  else if (r === 'marketing') html = marketing(a);
  else if (r === 'fans') html = a ? fanDetail(a) : fans();
  else if (r === 'money') html = moneyPage();
  else if (r === 'stats') html = stats();
  else if (r === 'settings') html = settings(a);
  else html = team();
  const y = scrollY;
  $('view').innerHTML = html;
  $('pageTitle').textContent = r === 'mixes' && a ? (ED?.isNew ? 'New mix' : 'Edit mix') : TITLES[r];
  document.title = `${r === 'mixes' && a && ED && !ED.isNew ? ED.t : TITLES[r]} · DJ Kelly Kay Control Centre`;
  drawNav(r); drawBell();
  if (r === 'mixes' && a) drawInlineWave();
  if (keepScroll) scrollTo(0, y);
}
addEventListener('hashchange', () => { setMenu(false); closeMenus(); render(); scrollTo(0, 0); $('view').focus({preventScroll: true}); });

/* ---------- search ---------- */
function runSearch(q){
  const box = $('qres'); q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const ms = M.filter(m => (m.t + ' ' + m.genre).toLowerCase().includes(q)).slice(0, 5);
  const fs = FANS.filter(f => (f.name + ' ' + f.email + ' ' + f.city).toLowerCase().includes(q)).slice(0, 5);
  box.innerHTML = (ms.length ? `<div class="pop__head">Mixes</div>` + ms.map(m => `<a class="pop__item" href="#mixes/${m.id}"><img src="${cover(m.id)}" alt=""><span>${esc(m.t)}<small>${esc(m.genre)}</small></span></a>`).join('') : '')
    + (fs.length ? `<div class="pop__head">Fans</div>` + fs.map(f => `<a class="pop__item" href="#fans/${f.id}"><span>${esc(f.name)}<small>${esc(f.city)} · ${f.plan === 'listen' ? 'Listen' : f.owned.size + ' mixes'}</small></span></a>`).join('') : '')
    || `<div class="empty">Nothing matches “${esc(q)}”.</div>`;
  box.hidden = false;
}
$('q').addEventListener('input', e => runSearch(e.target.value));

document.addEventListener('keydown', e => {

/* ---------- clicks ---------- */

    case 'startsHere': if (ED.tracks[edSel]) { ED.tracks[edSel].s = Math.round(fp.t); ED.tracks[edSel].est = false; if (edSel < ED.tracks.length - 1) edSel++; redrawTracks(); } break;
    case 'trAdd': { const last = ED.tracks[ED.tracks.length - 1]; ED.tracks.push({a:'', t:'', s: last ? Math.min(edLen(), last.s + 180) : 0, est:false}); edSel = ED.tracks.length - 1; redrawTracks(); document.querySelector(`[data-tf="a"][data-i="${edSel}"]`)?.focus(); break; }
    case 'trDel': ED.tracks.splice(i, 1); edSel = Math.min(edSel, Math.max(0, ED.tracks.length - 1)); redrawTracks(); break;
    case 'trUp': [ED.tracks[i - 1], ED.tracks[i]] = [ED.tracks[i], ED.tracks[i - 1]]; edSel = i - 1; redrawTracks(); break;
    case 'trDown': [ED.tracks[i + 1], ED.tracks[i]] = [ED.tracks[i], ED.tracks[i + 1]]; edSel = i + 1; redrawTracks(); break;
    case 'trPaste': openDlg(`<h2>Paste a tracklist</h2><p>One song per line, like <b>Artist - Song</b>. Start times like <b>12:30 Artist - Song</b> are picked up too.</p><textarea id="pasteBox" style="min-height:200px" placeholder="Intro&#10;Usher - You Make Me Wanna&#10;3:45 Coolio - Gangsta's Paradise"></textarea><div class="form__actions"><button class="btn btn--gold" data-act="pasteDo">Add these songs</button><button class="btn btn--soft" data-act="closeDlg">Cancel</button></div>`); setTimeout(() => $('pasteBox')?.focus(), 50); break;
    case 'pasteDo': { const list = parseList($('pasteBox').value); if (!list.length) { toast('Nothing to add'); break; } ED.tracks = list; if (list.some(x => x.est)) spreadTimes(); closeDlg(); edSel = 0; redrawTracks(); toast(`Added ${list.length} songs`); break; }
    case 'trAuto': {
      const btn = b; btn.disabled = true; btn.innerHTML = `${ic('sparkle')}Reading the cover…`;
      setTimeout(() => {
        const known = TRACKS[ED.id];
        ED.tracks = known ? parseTracks(ED.id, ED.len) : Array.from({length: 18}, (_, k) => ({a: k ? `Artist ${k}` : 'DJ Kelly Kay', t: k ? `Song ${k} (read from cover)` : 'Intro', s: 0, est: true}));
        spreadTimes(); edSel = 0; redrawTracks();

    case 'trDetect': { b.disabled = true; b.innerHTML = `${ic('wave')}Listening to the mix…`; setTimeout(() => { spreadTimes(); ED.waveOn = true; redrawTracks(); toast('Start times found. Drag the markers on the waveform to fix any marked “Check”.'); }, 1400); break; }
    case 'closeDlg': closeDlg(); break;
    case 'openDaw': openDaw(); break;
    case 'seg': fanSeg = b.dataset.id; fanPage = 0; render(true); break;
    case 'fanPrev': fanPage = Math.max(0, fanPage - 1); { const r = fanRows(); $('fanRows').innerHTML = r.rows; $('fanPager').innerHTML = r.pager; } break;
    case 'fanNext': fanPage++; { const r = fanRows(); $('fanRows').innerHTML = r.rows; $('fanPager').innerHTML = r.pager; } break;
    case 'gift': { const f = fanBy(b.dataset.id); openDlg(`<h2>Gift a mix to ${esc(f.name)}</h2><p>It goes straight into their Library to keep, with a note from you.</p><div class="field"><label for="giftMix">Mix</label><select id="giftMix">${paid.filter(m => !f.owned.has(m.id)).map(m => `<option value="${m.id}">${esc(m.t)}</option>`).join('')}</select></div><div class="field"><label for="giftNote">Note</label><input id="giftNote" value="Thanks for the support 🙏"></div><div class="form__actions"><button class="btn btn--gold" data-act="giftDo" data-id="${f.id}">${ic('gift')}Send gift</button><button class="btn btn--soft" data-act="closeDlg">Cancel</button></div>`); break; }
    case 'giftDo': { const f = fanBy(b.dataset.id), mid = $('giftMix').value; f.owned.add(mid); f.gifts.push(mid); LOG.unshift([0, 'DJ Kelly Kay', `Gifted ${mixBy(mid).t} to ${f.name}`]); closeDlg(); toast(`Gifted ${mixBy(mid).t}. Demo only, nothing is sent.`); render(true); break; }
    case 'refund': { const f = fanBy(b.dataset.id), os = ORDERS.filter(o => o.fan === f.id && o.status === 'paid'); if (!os.length) { toast('No payments to refund in the last 45 days'); break; } openDlg(`<h2>Refund ${esc(f.name)}</h2><p>The money goes back to their card in 5–10 days. A refunded mix leaves their Library.</p><div class="field"><label for="refOrder">Payment</label><select id="refOrder">${os.map(o => `<option value="${o.id}">${o.id} · ${o.kind === 'listen' ? 'Listen month' : o.mixes.map(x => mixBy(x).t).join(', ')} · ${money(o.amount)}</option>`).join('')}</select></div><div class="form__actions"><button class="btn btn--danger" data-act="refundDo" data-id="${f.id}">Refund</button><button class="btn btn--soft" data-act="closeDlg">Cancel</button></div>`); break; }
    case 'refundDo': { const o = ORDERS.find(x => x.id === $('refOrder').value); o.status = 'refunded'; const f = fanBy(o.fan); o.mixes.forEach(x => f.owned.delete(x)); LOG.unshift([0, 'DJ Kelly Kay', `Refunded ${o.id} (${money(o.amount)})`]); closeDlg(); toast(`Refunded ${money(o.amount)}. Demo only, no money moved.`); render(true); break; }
    case 'extend': { const f = fanBy(b.dataset.id); if (f.plan !== 'listen') { f.plan = 'listen'; f.graceDay = 0; } f.months++; LOG.unshift([0, 'DJ Kelly Kay', `Added 30 days of Listen for ${f.name}`]); toast(`Added 30 free days of Listen for ${f.name}. Demo only.`); render(true); break; }
    case 'receipt': toast(`Receipt re-sent to ${fanBy(b.dataset.id).email}. Demo only, nothing is sent.`); break;
    case 'smsOff': { const f = fanBy(b.dataset.id); f.sms = false; f.stop = true; toast(`${f.name} won't get texts any more`); render(true); break; }
    case 'exportFans': csvDownload('kk-fans.csv', [['Name','Email','City','Plan','Mixes owned','Plays','Last active (days)','Texts']].concat(fanList().map(f => [f.name, f.email, f.city, f.plan, f.owned.size, f.plays, f.last, f.sms ? 'yes' : 'no']))); break;
    case 'csv': csvDownload('kk-payments.csv', [['Order','Date','Fan','Type','Mixes','Amount NZD (incl GST)','GST','Status','Came from']].concat(ORDERS.map(o => [o.id, iso(dayOf(o.day)), fanBy(o.fan).name, o.kind, o.mixes.map(x => mixBy(x)?.t).join('; '), o.amount.toFixed(2), (o.amount * 3 / 23).toFixed(2), o.status, o.via]))); break;
    case 'remind': toast(`Reminder sent to ${fanBy(b.dataset.id).name}. Demo only.`); break;
    case 'sendBlast': {
      const m = mixBy(blast.mix), A = audiences(blast.mix)[blast.aud]; const chs = Object.entries(blast.ch).filter(([, v]) => v).map(([k]) => k);
      if (!chs.length) { toast('Pick at least one way to send it'); break; }
      openDlg(`<h2>${blast.when === 'now' ? 'Send it now?' : 'Schedule it?'}</h2><p>${esc(m.t)} to about ${A.length} fans by ${chs.map(c => ({app:'app notification', text:'text', email:'email'})[c]).join(', ')}.</p><div class="form__actions"><button class="btn btn--gold" data-act="blastDo">${blast.when === 'now' ? 'Send' : 'Schedule'}</button><button class="btn btn--soft" data-act="closeDlg">Cancel</button></div>`); break; }
    case 'blastDo': { const A = audiences(blast.mix)[blast.aud]; BLASTS.unshift({mix: blast.mix, when: TODAY, audience: ({everyone:'Everyone', similar:'Similar listeners', series:'Series fans', members:'Listen members'})[blast.aud], push: blast.ch.app ? A.length : 0, text: blast.ch.text ? A.filter(f => f.sms).length : 0, email: blast.ch.email ? A.length : 0, opened: 0, sales: 0}); LOG.unshift([0, 'DJ Kelly Kay', `${blast.when === 'now' ? 'Sent' : 'Scheduled'} the ${mixBy(blast.mix).t} announcement`]); closeDlg(); toast(`${blast.when === 'now' ? 'Sent' : 'Scheduled'}. Demo only, nothing went out.`); blast.msg = ''; render(true); break; }
    case 'newOffer': openDlg(`<h2>New offer</h2><p>Shows in the cart and the app's offer pop-ups.</p><div class="field"><label for="no-type">Type</label><select id="no-type"><option value="bundle">Bundle (a few mixes for one price)</option><option value="sale">Sale on one mix</option><option value="code">Promo code</option></select></div><div class="field"><label for="no-name">Name</label><input id="no-name" placeholder="e.g. Summer Days weekend"></div><div class="field"><label for="no-detail">Deal</label><input id="no-detail" placeholder="e.g. Summer Days Vol 5 for $12"></div><div class="grid2"><div class="field"><label for="no-code">Code (for promo codes)</label><input id="no-code" placeholder="e.g. SUMMER5" style="text-transform:uppercase"></div><div class="field"><label for="no-end">Ends</label><input id="no-end" type="date" value="${iso(dayOf(-7))}"></div></div><div class="form__actions"><button class="btn btn--gold" data-act="offerDo">Create offer</button><button class="btn btn--soft" data-act="closeDlg">Cancel</button></div>`); break;
    case 'offerDo': { const name = $('no-name').value.trim(); if (!name) { toast('Give the offer a name'); break; } OFFERS.unshift({id: 'o' + Date.now(), name, type: $('no-type').value, detail: $('no-detail').value.trim() || name, code: $('no-code').value.trim().toUpperCase(), start: iso(TODAY), end: $('no-end').value, uses: 0, on: true}); closeDlg(); toast('Offer created. Demo only.'); if (location.hash !== '#marketing/offers') location.hash = '#marketing/offers'; else render(true); break; }
    case 'saveTrig': { const t = TRIGGERS.find(x => x.id === b.dataset.id); t.msg = document.querySelector(`[data-tmsg="${t.id}"]`).value; const p = document.querySelector(`[data-tprice="${t.id}"]`), p2 = document.querySelector(`[data-tprice2="${t.id}"]`); if (p) t.price = p.value; if (p2) t.price2 = p2.value; toast(`${t.name} saved. Demo only.`); break; }
    case 'shelfUp': [HOME.shelves[i - 1], HOME.shelves[i]] = [HOME.shelves[i], HOME.shelves[i - 1]]; render(true); break;
    case 'shelfDown': [HOME.shelves[i + 1], HOME.shelves[i]] = [HOME.shelves[i], HOME.shelves[i + 1]]; render(true); break;
    case 'saveHome': toast('Home page order saved. Demo only, the fan app isn’t changed.'); break;
    case 'saveSettings': LOG.unshift([0, 'DJ Kelly Kay', 'Changed settings']); toast('Settings saved. Demo only, nothing is stored.'); render(true); break;
    case 'demoOnly': toast('Demo only'); break;
    case 'invite': openDlg(`<h2>Invite someone</h2><p>They get an email with a login link. No password needed.</p><div class="field"><label for="inv-name">Name</label><input id="inv-name" placeholder="e.g. Tavita"></div><div class="field"><label for="inv-email">Email</label><input id="inv-email" type="email" placeholder="name@example.com"></div><div class="field"><label for="inv-role">Role</label><select id="inv-role">${['uploader','admin'].map(r => `<option value="${r}">${ROLES[r][0]}: ${ROLES[r][1]}</option>`).join('')}</select></div><div class="form__actions"><button class="btn btn--gold" data-act="inviteDo">Send invite</button><button class="btn btn--soft" data-act="closeDlg">Cancel</button></div>`); break;
    case 'inviteDo': { const n = $('inv-name').value.trim(), em = $('inv-email').value.trim(); if (!n || !/.+@.+\..+/.test(em)) { toast('Add a name and a valid email'); break; } TEAM.push({name: n, email: em, role: $('inv-role').value, last: null, invited: true}); LOG.unshift([0, 'DJ Kelly Kay', `Invited ${n} to the team`]); closeDlg(); toast('Invite ready. Demo only, no email sent.'); if (location.hash !== '#team') location.hash = '#team'; else render(true); break; }

$('scrim').addEventListener('click', () => setMenu(false));
$('menuBtn').addEventListener('click', () => setMenu(!$('shell').classList.contains('menu-open')));
/* In the Claude artifact viewer files are offered through its downloads capability; on the website, a normal download link. */
let dlNs = null;
if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(ns => { dlNs = ns; }, () => {});
async function csvDownload(name, rows){
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');
  if (dlNs) { try { await dlNs.save({filename: name, data: '﻿' + csv}); toast(`Saved ${name}`); } catch (e) { if (e && e.code === 'rate_limited') toast('One moment, then try again'); else if (!e || e.code !== 'declined') toast('Downloads aren’t available in this view'); } return; }
  if (window.claude) { toast('Downloads aren’t available in this view'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv'})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(`Downloaded ${name} (${rows.length - 1} rows)`);
}

/* ---------- form inputs ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mixQ') { mixQ = t.value; $('mixRows').innerHTML = mixRows(); }
  if (t.id === 'fanQ') { fanQ = t.value; fanPage = 0; const r = fanRows(); $('fanRows').innerHTML = r.rows; $('fanPager').innerHTML = r.pager; }
  if (ED && t.dataset.f && t.id !== 'f-ps') { ED[t.dataset.f] = t.value; if (t.dataset.f === 't') redraw('crops', cropsHtml()); }
  if (ED && t.dataset.tf) { const x = ED.tracks[+t.dataset.i]; if (t.dataset.tf === 's') { const v = parseTime(t.value); if (v != null) { x.s = v; x.est = false; } } else x[t.dataset.tf] = t.value; if (+t.dataset.i === 0) redraw('crops', cropsHtml()); drawInlineWave(); }
  if (t.id === 'fpSeek') { fp.t = +t.value; $('fpTime').textContent = `${mmss(fp.t)} / ${mmss(edLen())}`; const k = curSong(fp.t); if (k >= 0) $('fpNow').innerHTML = `Now playing: <b>${esc(ED.tracks[k].t || 'Untitled')}</b> · ${esc(ED.tracks[k].a)}`; drawInlineWave(); }
  if (t.id === 'b-msg') { blast.msg = t.value; $('b-count').textContent = t.value.length; if ($('pv-app')) $('pv-app').textContent = t.value; if ($('pv-sms')) $('pv-sms').textContent = t.value + ' Reply STOP to opt out.'; }
});
document.addEventListener('focusin', e => { const r = e.target.closest?.('tr[data-row]'); if (r && ED && +r.dataset.row !== edSel) { edSel = +r.dataset.row; document.querySelectorAll('.trk tr[data-row]').forEach(x => x.classList.toggle('sel', +x.dataset.row === edSel)); drawInlineWave(); const s = document.querySelector('[data-act="startsHere"]'); if (s) s.innerHTML = `${ic('pin')}Song ${edSel + 1} starts here`; } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mixF') { mixF = t.value; $('mixRows').innerHTML = mixRows(); }
  if (t.id === 'mixSort') { mixSort = t.value; $('mixRows').innerHTML = mixRows(); }
  if (t.id === 'fanPlan') { fanPlan = t.value; fanPage = 0; const r = fanRows(); $('fanRows').innerHTML = r.rows; $('fanPager').innerHTML = r.pager; }
  if (t.id === 'f-ps' && ED) { const v = parseTime(t.value); if (v != null) ED.previewStart = Math.min(v, edLen()); t.value = mmss(ED.previewStart); }
  if (ED && t.dataset.f === 'status') ED.status = t.value;
  if (ED && t.dataset.tf === 's') { const v = parseTime(t.value); if (v == null) t.value = mmss(ED.tracks[+t.dataset.i].s); else t.value = mmss(v); }
  if (ED && t.dataset.tag) { ED.tags = t.checked ? [...new Set([...ED.tags, t.dataset.tag])] : ED.tags.filter(x => x !== t.dataset.tag); }
  if (ED && t.dataset.pm) { ED.priceMode = t.dataset.pm; const p = $('f-price'); p.disabled = t.dataset.pm !== 'custom'; if (!p.disabled) { p.value = ED.price || SETTINGS.price; p.focus(); } }
  if (t.id === 'coverFile' && t.files[0]) { const r = new FileReader(); r.onload = () => { ED.cover = r.result; redraw('crops', cropsHtml()); toast('Cover added. Check how it looks below.'); }; r.readAsDataURL(t.files[0]); t.value = ''; }
  if (t.id === 'audioFile' && t.files[0]) { startUpload(t.files[0]); t.value = ''; }
  if (t.dataset.aud) { blast.aud = t.dataset.aud; render(true); }
  if (t.dataset.ch) { blast.ch[t.dataset.ch] = t.checked; render(true); }
  if (t.dataset.when) { blast.when = t.dataset.when; render(true); }
  if (t.id === 'b-mix') { blast.mix = t.value; blast.msg = ''; if (!audiences(blast.mix)[blast.aud].length) blast.aud = 'everyone'; render(true); }
  if (t.dataset.offer) { const o = OFFERS.find(x => x.id === t.dataset.offer); o.on = t.checked; toast(`${o.name} is ${o.on ? 'on' : 'off'}`); }
  if (t.dataset.trig) { const x = TRIGGERS.find(y => y.id === t.dataset.trig); x.on = t.checked; $('trig-' + x.id).classList.toggle('off', !x.on); toast(`${x.name} is ${x.on ? 'on' : 'off'}`); }
  if (t.dataset.shelf) HOME.shelves[+t.dataset.shelf].on = t.checked;
  if (t.id === 'h-feat') { HOME.featured = t.value; render(true); }
  if (t.id === 'statMix') { statMix = t.value; $('dropOff').innerHTML = dropOff(statMix); }
  if (t.dataset.s) { const k = t.dataset.s; SETTINGS[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' || t.tagName === 'SELECT' ? Number(t.value) : t.value; }
  if (t.dataset.acc) SETTINGS.accent = t.dataset.acc;
  if (t.dataset.lic) { const m = mixBy(t.dataset.lic); m.licence = t.value; toast(`${m.t}: ${t.options[t.selectedIndex].text}`); }
  if (t.dataset.licn) mixBy(t.dataset.licn).licNote = t.value;
  if (t.dataset.role) { TEAM[+t.dataset.role].role = t.value; toast(`${TEAM[+t.dataset.role].name} is now ${ROLES[t.value][0]}`); }
});
/* drag and drop an MP3 onto the upload box */
document.addEventListener('dragover', e => { const d = e.target.closest?.('#audioDrop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest?.('#audioDrop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest?.('#audioDrop'); if (d) { e.preventDefault(); d.classList.remove('over'); startUpload(e.dataTransfer.files[0]); } });

$('menuBtn').innerHTML = ic('menu', 'ic');
$('searchIc').outerHTML = ic('search');
document.querySelector('.topbar__new').innerHTML = `${ic('plus')}<span>New</span>`;
document.querySelector('#newMenu .pop__item small').textContent = 'Upload the MP3, cover and tracklist';

render();
